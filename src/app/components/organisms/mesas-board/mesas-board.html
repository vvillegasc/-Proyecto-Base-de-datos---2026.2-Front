<div class="mesas-board">
  <h3 class="mesas-board__title">Estado de Mesas</h3>

  @if (mesas.length === 0) {
    <p class="mesas-board__empty">Sin mesas registradas.</p>
  } @else {
    <div class="mesas-board__grid">
      @for (mesa of mesas; track mesa.numeroMesa) {
        <div [class]="'mesas-board__card mesas-board__card--' + mesa.estado.toLowerCase()">
          <span class="mesas-board__numero">M{{ mesa.numeroMesa }}</span>
          <span class="mesas-board__estado">{{ abreviatura[mesa.estado] }}</span>
        </div>
      }
    </div>

    <div class="mesas-board__leyenda">
      <span><i class="mesas-board__punto mesas-board__card--disponible"></i>Libre</span>
      <span><i class="mesas-board__punto mesas-board__card--ocupada"></i>Ocupada</span>
      <span><i class="mesas-board__punto mesas-board__card--reservada"></i>Reservada</span>
      <span><i class="mesas-board__punto mesas-board__card--en_mantenimiento"></i>Mantenimiento</span>
    </div>
  }
</div>
