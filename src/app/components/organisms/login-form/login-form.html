<form class="login-form" (submit)="$event.preventDefault(); onSubmit()">
  <h2 class="login-form__title">Iniciar Sesión</h2>
  <p class="login-form__subtitle">Acceso para el personal de Savana</p>

  <div class="login-form__fields">
    <app-form-field
      id="email"
      label="Correo electrónico"
      type="email"
      placeholder="nombre@savanacoffee.com"
      [value]="correo"
      (valueChange)="correo = $event"
    />
    <app-form-field
      id="password"
      label="Contraseña"
      type="password"
      placeholder="Tu contraseña"
      [value]="contrasena"
      (valueChange)="contrasena = $event"
    />
  </div>

  @if (errorLocal || error) {
    <p class="login-form__error">{{ errorLocal || error }}</p>
  }

  <app-button
    [label]="cargando ? 'INGRESANDO...' : 'INICIAR SESIÓN'"
    type="submit"
    [fullWidth]="true"
    [disabled]="cargando"
  />
</form>
