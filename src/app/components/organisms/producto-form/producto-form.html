<div class="producto-form">
  <app-form-field
    label="Nombre"
    id="pNombre"
    [error]="errores['nombre'] ?? ''"
    [value]="form.nombre"
    (valueChange)="form.nombre = $event"
  />

  <app-textarea-field
    label="Descripción"
    id="pDesc"
    [error]="errores['descripcion'] ?? ''"
    placeholder="Notas, ingredientes o preparación..."
    [maxLength]="200"
    [value]="form.descripcion ?? ''"
    (valueChange)="form.descripcion = $event"
  />

  <div class="producto-form__row">
    <app-form-field
      label="Precio"
      id="pPrecio"
      [error]="errores['precio'] ?? ''"
      type="number"
      [value]="form.precio"
      (valueChange)="form.precio = +$event"
    />
    <app-form-field
      label="Stock"
      id="pStock"
      [error]="errores['stock'] ?? ''"
      type="number"
      [value]="form.stock"
      (valueChange)="form.stock = +$event"
    />
  </div>

  <div class="producto-form__field">
    <label class="producto-form__label" for="pCat">Categoría</label>
    <select id="pCat" class="producto-form__select" [(ngModel)]="form.nombreCategoria">
      <option value="" disabled>Seleccionar categoría...</option>
      @for (cat of categorias; track cat.nombreCategoria) {
        <option [value]="cat.nombreCategoria">
          {{ cat.nombreCategoria }}{{ cat.estado === 'INACTIVA' ? ' (inactiva)' : '' }}
        </option>
      }
    </select>
    @if (errores['nombreCategoria']) {
      <span class="campo-error">{{ errores['nombreCategoria'] }}</span>
    }
  </div>

  <app-form-field
    label="URL Imagen"
    id="pImg"
    [error]="errores['imagenUrl'] ?? ''"
    placeholder="https://..."
    [value]="form.imagenUrl"
    (valueChange)="onImagenChange($event)"
  />

  <div class="producto-form__preview">
    @if (form.imagenUrl && !imagenConError) {
      <img [src]="form.imagenUrl" alt="Vista previa" (error)="imagenConError = true" />
    } @else {
      <span>{{ imagenConError ? 'No se pudo cargar la imagen' : 'Vista previa de la imagen' }}</span>
    }
  </div>

  <div class="producto-form__check">
    <label class="producto-form__check-label">
      <input type="checkbox" [(ngModel)]="form.disponibilidad" />
      Disponible
    </label>
  </div>

  <app-button
    [label]="guardando ? 'GUARDANDO...' : editando ? 'ACTUALIZAR' : 'CREAR PRODUCTO'"
    [fullWidth]="true"
    [disabled]="guardando"
    (click)="guardar.emit()"
  />
</div>
