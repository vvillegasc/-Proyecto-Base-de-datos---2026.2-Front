<nav class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo">Savana</span>
    <span class="sidebar__sub">GESTIÓN DE CAFETERÍA</span>
  </div>

  <ul class="sidebar__nav">
    @for (item of navItems(); track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="sidebar__link--active" class="sidebar__link">
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="sidebar__footer">
    @if (sesion.usuario(); as usuario) {
      <div class="sidebar__user">
        <div class="sidebar__user-avatar">{{ usuario.nombres[0]?.toUpperCase() }}</div>
        <div class="sidebar__user-info">
          <span class="sidebar__user-name">{{ usuario.nombres }} {{ usuario.apellidos }}</span>
          <span class="sidebar__user-role">{{ usuario.rol === 'ADMINISTRADOR' ? 'Administrador' : 'Mesero' }}</span>
        </div>
      </div>
    }
    <button class="sidebar__logout" type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>
