<div class="cliente-card">
  <div class="cliente-card__header">
    <app-avatar [name]="cliente.nombre + ' ' + cliente.apellido" />
    <div class="cliente-card__info">
      <span class="cliente-card__nombre">{{ cliente.nombre }} {{ cliente.apellido }}</span>
      <span class="cliente-card__email">{{ cliente.correo }}</span>
      <span class="cliente-card__tel">{{ cliente.telefono }}</span>
    </div>
  </div>
  @if (editable) {
    <div class="cliente-card__actions">
      <app-button label="EDITAR" variant="secondary" (click)="editar.emit(cliente)" />
      <app-button label="ELIMINAR" variant="danger" (click)="eliminar.emit(cliente)" />
    </div>
  }
</div>
