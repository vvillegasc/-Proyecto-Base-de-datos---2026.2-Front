<div class="dashboard-layout" [class.dashboard-layout--menu-abierto]="menuAbierto()">
  <header class="dashboard-layout__topbar">
    <button class="dashboard-layout__toggle" type="button" aria-label="Abrir menú" (click)="menuAbierto.set(true)">☰</button>
    <img class="dashboard-layout__logo" src="/assets/savana-logo-horizontal-claro.png" alt="Savana Data Coffee" width="1397" height="236" />
  </header>

  <div class="dashboard-layout__sidebar">
    <app-sidebar />
  </div>
  <div class="dashboard-layout__backdrop" (click)="menuAbierto.set(false)"></div>

  <main class="dashboard-layout__main">
    <ng-content />
  </main>
</div>
