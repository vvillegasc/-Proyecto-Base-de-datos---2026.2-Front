<app-dashboard-layout>
  <div class="page">
    <div class="page__header">
      <div>
        <h1 class="page__title">{{ sesion.esAdmin() ? 'Productos' : 'Menú' }}</h1>
        <span class="page__breadcrumb">Savana / Menú{{ sesion.esAdmin() ? ' / Productos' : '' }}</span>
      </div>
      @if (sesion.esAdmin()) {
        <app-button label="+ NUEVO PRODUCTO" (click)="abrirCrear()" />
      }
    </div>

    <app-tab-filter [tabs]="tabs" [active]="categoriaActiva()" (tabChange)="cambiarCategoria($event)" />

    <app-search-bar
      placeholder="Buscar por nombre..."
      [value]="busqueda()"
      (valueChange)="busqueda.set($event)"
    />

    <p class="page__count">Productos ({{ productosFiltrados.length }} registros)</p>

    <div class="page__grid">
      @for (p of productosFiltrados; track p.idProducto) {
        <app-producto-card
          [producto]="p"
          [editable]="sesion.esAdmin()"
          (editar)="abrirEditar($event)"
          (eliminar)="porEliminar.set($event)"
        />
      } @empty {
        <app-empty-state title="No hay productos" message="Prueba con otra categoría o búsqueda." [actionLabel]="sesion.esAdmin() ? '+ NUEVO PRODUCTO' : ''" (action)="abrirCrear()" />
      }
    </div>
  </div>
</app-dashboard-layout>

<app-modal
  [title]="editando() ? 'Editar Producto' : 'Nuevo Producto'"
  [visible]="modalVisible()"
  (close)="modalVisible.set(false)"
>
  <app-producto-form
    [form]="form"
    [editando]="!!editando()"
    (guardar)="guardar()"
  />
</app-modal>

<app-confirm-dialog
  title="Eliminar producto"
  [message]="'¿Seguro que quieres eliminar ' + porEliminar()?.nombre + '? Esta acción no se puede deshacer.'"
  confirmLabel="ELIMINAR"
  [visible]="!!porEliminar()"
  (confirm)="confirmarEliminar()"
  (cancel)="porEliminar.set(null)"
/>
