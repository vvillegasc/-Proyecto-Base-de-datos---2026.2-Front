<app-dashboard-layout>
  <div class="page">
    <div class="page__header">
      <div>
        <h1 class="page__title">Clientes</h1>
        <span class="page__breadcrumb">Savana / Clientes</span>
      </div>
      <app-button label="+ NUEVO CLIENTE" (click)="abrirCrear()" />
    </div>

    <app-search-bar
      placeholder="Buscar por nombre o correo..."
      [value]="busqueda()"
      (valueChange)="busqueda.set($event)"
    />

    <p class="page__count">Clientes ({{ clientesFiltrados.length }} registros)</p>

    <div class="page__grid">
      @for (c of clientesFiltrados; track c.idCliente) {
        <app-cliente-card [cliente]="c" [editable]="sesion.esAdmin()" (editar)="abrirEditar($event)" (eliminar)="porEliminar.set($event)" />
      } @empty {
        <app-empty-state title="No hay clientes" message="Ningún cliente coincide con la búsqueda." actionLabel="+ NUEVO CLIENTE" (action)="abrirCrear()" />
      }
    </div>
  </div>
</app-dashboard-layout>

<app-modal
  [title]="editando() ? 'Editar Cliente' : 'Nuevo Cliente'"
  [visible]="modalVisible()"
  (close)="modalVisible.set(false)"
>
  <div class="modal-form">
    <app-form-field label="Nombre" id="cNombres" [value]="form.nombre" (valueChange)="form.nombre = $event" />
    <app-form-field label="Apellido" id="cApellidos" [value]="form.apellido" (valueChange)="form.apellido = $event" />
    <app-form-field label="Correo electrónico" id="cCorreo" type="email" [value]="form.correo" (valueChange)="form.correo = $event" />
    <app-form-field label="Teléfono" id="cTel" [value]="form.telefono" (valueChange)="form.telefono = $event" />
    <app-button label="GUARDAR" [fullWidth]="true" (click)="guardar()" />
  </div>
</app-modal>

<app-confirm-dialog
  title="Eliminar cliente"
  [message]="'¿Seguro que quieres eliminar a ' + porEliminar()?.nombre + ' ' + porEliminar()?.apellido + '?'"
  confirmLabel="ELIMINAR"
  [visible]="!!porEliminar()"
  (confirm)="confirmarEliminar()"
  (cancel)="porEliminar.set(null)"
>
  <p class="confirm-nota">
    No se puede eliminar un cliente que tenga reservas pendientes o confirmadas, ni pedidos o facturas registrados.
  </p>
</app-confirm-dialog>
